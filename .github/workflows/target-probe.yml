# 利用者の地点リスト（△・×）の場所を OSM から探す（読み取りだけ。DBへは SELECT のみ）
name: target-probe
on: workflow_dispatch
concurrency: { group: target-probe, cancel-in-progress: false }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - run: pip install -r requirements.txt
      - name: 数える
        shell: bash
        run: |
          python -m tools.target_probe --out target-out | tee target.log
          { echo '## 地点リストの場所（OSM）'; cat target-out/summary.md; } >> "$GITHUB_STEP_SUMMARY"
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: target-probe, path: "target-out/", retention-days: 30 }
