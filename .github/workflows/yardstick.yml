# 評価の物差し（読み取りのみ）：場所検索の地点リストと流れ検索の確認用シーン文を採点し、基準より後退していれば失敗（赤）にする
# 本番DBを見るので、SQL を変える PR は db-migrate の後に測る（db-migrate・pipeline・deploy-web の成功後に自動でも動く）。
# write_baseline=true：今の結果を基準として yardstick-baseline の成果物に出す（main へは自動で入れない。PR で取り込む）
name: yardstick
on:
  workflow_dispatch:
    inputs:
      write_baseline: { description: "今の結果を基準として出す（採点は失敗にしない）", type: boolean, default: false }
  workflow_run:
    workflows: [db-migrate, pipeline]
    types: [completed]
    branches: [main]
jobs:
  score:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
      - run: pip install "psycopg[binary]>=3.2"
      - name: 採点
        run: |
          flags=""
          if [ "${{ inputs.write_baseline }}" = "true" ]; then flags="--write-baseline"; fi
          python tools/yardstick.py run --json yardstick.json $flags | tee -a "$GITHUB_STEP_SUMMARY"
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yardstick
          path: |
            yardstick.json
            data/yardstick/place_cuts.json
            data/yardstick/flow_baseline.json
          retention-days: 14
