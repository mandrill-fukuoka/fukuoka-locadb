# 毎週月曜 6:00 JST：収集 → AI分類 → クラスター生成 → 変化リスク監視 → バックアップ
name: weekly-pipeline
on:
  schedule: [{ cron: "0 21 * * 0" }]
  workflow_dispatch:
    inputs:
      area:
        description: "対象（all または fuk-chuo / fuk-hakata / fuk-higashi / fuk-sawara / fuk-nishi / fuk-minami / fuk-jonan）"
        default: "fuk-chuo"
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: パイプライン実行
        run: |
          AREA="${{ github.event.inputs.area || 'all' }}"
          if [ "$AREA" = "all" ]; then python -m locadb.pipeline --all; else python -m locadb.pipeline --area "$AREA"; fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: バックアップ（Supabase無料枠は自動バックアップなし）
        if: always()
        run: |
          docker run --rm -v "$PWD:/out" -e DATABASE_URL postgres:17 \
            pg_dump "$DATABASE_URL" --no-owner --no-privileges -n public -Fc -f /out/locadb-$(date +%Y%m%d).dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: locadb-backup, path: "*.dump", retention-days: 90 }
