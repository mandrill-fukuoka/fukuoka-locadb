# RLS が無効の public テーブルを一覧にする（読み取りのみ。本番は変更しない）
name: rls-check
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "psycopg[binary]>=3.2"
      - name: RLS が無効のテーブル
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              rows = c.execute("""
                  select c.relname, pg_get_userbyid(c.relowner), c.relrowsecurity,
                         has_table_privilege('anon', c.oid, 'select'),
                         (select count(*) from pg_depend d where d.objid = c.oid and d.deptype = 'e')
                    from pg_class c join pg_namespace n on n.oid = c.relnamespace
                   where n.nspname = 'public' and c.relkind in ('r','p') and not c.relrowsecurity
                   order by 1""").fetchall()
              print("## RLS が無効の public テーブル\n")
              print("| テーブル | 所有者 | anon が select 可 | 拡張の一部 |")
              print("|---|---|---|---|")
              for name, owner, _, anon, ext in rows:
                  print(f"| {name} | {owner} | {anon} | {'はい' if ext else 'いいえ'} |")
              print(f"\n件数：{len(rows)}")
          PY
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
