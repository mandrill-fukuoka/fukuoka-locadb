# データの診断：件数・要確認・重複の疑い・紐付けの不整合・直近の収集（読み取りのみ）
name: diagnose
on: { workflow_dispatch: {} }
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "psycopg[binary]>=3.2"
      - name: 診断
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              has = c.execute("select to_regclass('public.data_runs')").fetchone()[0]
              if not has:
                  print("v2 の表がまだありません（db-migrate を実行してください）")
                  for t in ("spots", "raw_candidates"):
                      n = c.execute(f"select count(*) from {t}").fetchone()[0] if c.execute(f"select to_regclass('public.{t}')").fetchone()[0] else "-"
                      print(f"- {t}: {n}")
              else:
                  d = c.execute("select diag_summary()").fetchone()[0]
                  print("```json\n" + json.dumps(d, ensure_ascii=False, indent=1, default=str) + "\n```")
          PY
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      # AIの下書きを出どころ・状態・プロンプトの版ごとに数える（本文は出さない。読み取りのみ）
      - name: AIの下書き（版ごと）
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              if not c.execute("select to_regclass('public.spot_ai_notes')").fetchone()[0]:
                  print("spot_ai_notes がありません"); raise SystemExit
              c.execute("set time zone 'Asia/Tokyo'")
              rows = c.execute("""
                  select source, status, coalesce(prompt_version, '-'), count(*),
                         count(distinct spot_id), min(created_at), max(created_at)
                    from spot_ai_notes group by 1, 2, 3 order by 1, 3, 2""").fetchall()
              print("\n### AIの下書き（出どころ・版・状態ごと）\n")
              print("| 出どころ | 版 | 状態 | 件数 | 地点数 | 最初 | 最後 |")
              print("|---|---|---|---:|---:|---|---|")
              for s, st, v, n, ns, a, b in rows:
                  print(f"| {s} | {v} | {st} | {n} | {ns} | {a:%m-%d %H:%M} | {b:%m-%d %H:%M} |")
              dup = c.execute("""select count(*) from (select spot_id from spot_ai_notes
                                   where status = 'draft' group by spot_id, source having count(*) > 1) x""").fetchone()[0]
              print(f"\n同じ地点・同じ出どころで下書きが2件以上：{dup}（0 が正常）")
          PY
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      - name: v4の品質（件数のみ）
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              q=lambda sql: c.execute(sql).fetchall()
              base="from spot_ai_notes n join spots s on s.id=n.spot_id where n.prompt_version='laya-summary-v4' and n.status='draft'"
              print("total/distinct body/distinct first20/min/avg/max len:", q(f"select count(*),count(distinct n.body),count(distinct left(n.body,20)),min(length(n.body)),round(avg(length(n.body))),max(length(n.body)) {base}"))
              print("most repeated first20 counts:", [r[0] for r in q(f"select count(*) {base} group by left(n.body,20) order by 1 desc limit 5")])
              print("by category (n, distinct first20):", q(f"select s.category,count(*),count(distinct left(n.body,20)) {base} group by 1 order by 2 desc limit 8"))
              print("spots without any laya draft by category:", q("select s.category,count(*) from spots s where s.data_status='current' and not exists(select 1 from spot_ai_notes n where n.spot_id=s.id and n.status in ('draft','accepted')) group by 1 order by 2 desc"))
              print("v3 superseded by v4:", q("select count(*) from spot_ai_notes a where a.prompt_version='laya-summary-v3' and a.status='superseded' and exists(select 1 from spot_ai_notes b where b.spot_id=a.spot_id and b.prompt_version='laya-summary-v4')"))
          PY
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
