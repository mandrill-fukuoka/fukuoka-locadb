# データの診断：件数・要確認・重複の疑い・紐付けの不整合・直近の収集（読み取りのみ）
name: diagnose
on: { workflow_dispatch: {} }
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "psycopg[binary]>=3.2"
      - name: 診断
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              has = c.execute("select to_regclass('public.data_runs')").fetchone()[0]
              if not has:
                  print("v2 の表がまだありません（db-migrate を実行してください）")
                  for t in ("spots", "raw_candidates"):
                      n = c.execute(f"select count(*) from {t}").fetchone()[0] if c.execute(f"select to_regclass('public.{t}')").fetchone()[0] else "-"
                      print(f"- {t}: {n}")
              else:
                  d = c.execute("select diag_summary()").fetchone()[0]
                  d.update(c.execute("select diag_heavy()").fetchone()[0])      # 区の境界との照合（重い。画面では出さない）
                  print("```json\n" + json.dumps(d, ensure_ascii=False, indent=1, default=str) + "\n```")
          PY
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      # 診断の各項目の所要時間と、画面（service_role）が受ける時間制限（読み取りのみ）。runs.php が500になる原因の切り分け用
      - name: 診断の所要時間
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, time, psycopg
          Q = {
            "diag_summary() 全体": "select diag_summary()",
            "diag_heavy() 全体": "select diag_heavy()",
            "area_mismatch": "select count(*) from spots s join areas a on a.code = s.area_code where a.geom is not null and s.data_status <> 'archived' and not ST_Covers(a.geom, s.geom)",
            "duplicate_candidates(1000,150)": "select jsonb_array_length(duplicate_candidates(1000, 150))",
            "orphan_links": "select count(*) from spot_features sf where not exists (select 1 from features f where f.key = sf.feature_key)",
            "spots_without_feature": "select count(*) from spots s where s.origin = 'osm' and not exists (select 1 from spot_features sf where sf.spot_id = s.id)",
            "clusters_with_archived_spot": "select count(*) from clusters c where c.status <> 'archived' and exists (select 1 from cluster_spots cs join spots s on s.id = cs.spot_id where cs.cluster_id = c.id and s.data_status = 'archived')",
            "by_category など集計": "select count(*) from (select category, count(*) n from spots where data_status <> 'archived' group by 1) x",
            "data_runs 15件（report つき）": "select id, report, summary, error from data_runs order by id desc limit 15",
            "job_runs 30件": "select run_id, job, stats, error from job_runs order by id desc limit 30",
          }
          print("## 診断の所要時間\n")
          with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as c:
              print("直接接続の statement_timeout：", c.execute("show statement_timeout").fetchone()[0])
              try:
                  c.execute("set role service_role")
                  print("service_role の statement_timeout：", c.execute("show statement_timeout").fetchone()[0])
              except Exception as e:
                  print("service_role に切り替えられません：", type(e).__name__)
              c.execute("reset role")
              print("\n| 項目 | 秒 |\n|---|---:|")
              for k, q in Q.items():
                  t = time.perf_counter()
                  try:
                      c.execute(q).fetchall()
                      print(f"| {k} | {time.perf_counter() - t:.2f} |")
                  except Exception as e:
                      print(f"| {k} | 失敗 {type(e).__name__} |")
              n = c.execute("select count(*), coalesce(max(length(report)),0), coalesce(sum(length(report)),0) from (select report from data_runs order by id desc limit 15) x").fetchone()
              print(f"\ndata_runs 直近15件の report：最大 {n[1]:,} 字・合計 {n[2]:,} 字")
          PY
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      # AIの下書きを出どころ・状態・プロンプトの版ごとに数える（本文は出さない。読み取りのみ）
      - name: AIの下書き（版ごと）
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              if not c.execute("select to_regclass('public.spot_ai_notes')").fetchone()[0]:
                  print("spot_ai_notes がありません"); raise SystemExit
              c.execute("set time zone 'Asia/Tokyo'")
              rows = c.execute("""
                  select source, status, coalesce(prompt_version, '-'), count(*),
                         count(distinct spot_id), min(created_at), max(created_at)
                    from spot_ai_notes group by 1, 2, 3 order by 1, 3, 2""").fetchall()
              print("\n### AIの下書き（出どころ・版・状態ごと）\n")
              print("| 出どころ | 版 | 状態 | 件数 | 地点数 | 最初 | 最後 |")
              print("|---|---|---|---:|---:|---|---|")
              for s, st, v, n, ns, a, b in rows:
                  print(f"| {s} | {v} | {st} | {n} | {ns} | {a:%m-%d %H:%M} | {b:%m-%d %H:%M} |")
              dup = c.execute("""select count(*) from (select spot_id from spot_ai_notes
                                   where status = 'draft' group by spot_id, source having count(*) > 1) x""").fetchone()[0]
              print(f"\n同じ地点・同じ出どころで下書きが2件以上：{dup}（0 が正常）")
          PY
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      # 空間特徴の分布（段階の境界を決める材料。読み取りのみ）
      - name: 空間特徴の分布
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              if not c.execute("select to_regclass('public.spot_spatial')").fetchone()[0]:
                  print("spot_spatial がありません"); raise SystemExit
              print("## 空間特徴の分布（信頼度 ok のみ）\n")
              q = lambda col: c.execute(f"""select count({col}), percentile_cont(array[.1,.25,.5,.75,.9]) within group (order by {col})
                                              from spot_spatial where confidence='ok'""").fetchone()
              for col in ("building_cover_100", "building_count_100", "open_ratio", "sight_max_m", "water_dist_m", "road_width_m"):
                  n, p = q(col); print(f"- {col}: n={n} 10/25/50/75/90% = " + " / ".join(f"{x:.3g}" for x in p))
              print("\n### 開放性の刻み別の地点数")
              for lo, hi in ((0,.2),(.2,.35),(.35,.5),(.5,.7),(.7,.9),(.9,1.01)):
                  n = c.execute("select count(*) from spot_spatial where confidence='ok' and open_ratio>=%s and open_ratio<%s", (lo, hi)).fetchone()[0]
                  print(f"- {lo}〜{hi}: {n}")
              print("\n### 建物面積率の刻み別")
              for lo, hi in ((0,.05),(.05,.15),(.15,.25),(.25,.35),(.35,1.01)):
                  n = c.execute("select count(*) from spot_spatial where confidence='ok' and building_cover_100>=%s and building_cover_100<%s", (lo, hi)).fetchone()[0]
                  print(f"- {lo}〜{hi}: {n}")
              print("\n### 水辺までの距離の刻み別（種類別）")
              for lo, hi in ((0,50),(50,100),(100,200),(200,500),(500,1e9)):
                  rows = c.execute("select water_kind, count(*) from spot_spatial where water_dist_m>=%s and water_dist_m<%s group by 1 order by 1", (lo, hi)).fetchall()
                  print(f"- {lo}〜{hi}m: " + ", ".join(f"{k}={n}" for k, n in rows))
              print("\n### 種別ごとの中央値（開放性・建物面積率・水辺m）")
              for r in c.execute("""select s.category, count(*), round((percentile_cont(.5) within group (order by ss.open_ratio))::numeric,2),
                                           round((percentile_cont(.5) within group (order by ss.building_cover_100))::numeric,2),
                                           round((percentile_cont(.5) within group (order by ss.water_dist_m))::numeric)
                                      from spot_spatial ss join spots s on s.id=ss.spot_id where ss.confidence='ok'
                                     group by 1 order by 2 desc""").fetchall():
                  print(f"- {r[0]}: n={r[1]} 開放性{r[2]} 面積率{r[3]} 水辺{r[4]}m")
          PY
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      # 雰囲気の目安（流れ検索 段階2）：周りの店の数の 10・50・90・99%点、当てはまり度・景観らしさ（読み取りのみ）
      - name: 雰囲気の目安の分布
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              if not c.execute("select to_regprocedure('public.vibe_stats()')").fetchone()[0]:
                  print("vibe_stats がありません（db-migrate を実行してください）"); raise SystemExit
              print("## 雰囲気の目安の分布\n\n```json\n" + json.dumps(c.execute("select vibe_stats()").fetchone()[0], ensure_ascii=False, indent=1) + "\n```")
          PY
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
