# OSM の飲食店・カフェ・バー・服飾店などの件数を数える（読み取りだけ。DBへは SELECT のみ）
name: shops-probe
on: workflow_dispatch
concurrency: { group: shops-probe, cancel-in-progress: false }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - run: pip install -r requirements.txt
      - name: 数える
        shell: bash
        run: |
          python -m tools.osm_shops_probe --out shops-out | tee shops.log
          { echo '## OSMの店舗・飲食'; cat shops-out/summary.md; } >> "$GITHUB_STEP_SUMMARY"
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shops-probe, path: "shops-out/", retention-days: 30 }
