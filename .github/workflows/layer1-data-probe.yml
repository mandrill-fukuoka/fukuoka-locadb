# 層1の外部データ（気象庁の潮位・国土数値情報の人口集中地区）の入手先と形式を確かめる（読み取りだけ。DBは触らない）
name: layer1-data-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pyshp
      - name: 調べる
        shell: bash
        run: |
          python tools/layer1_data_probe.py --out layer1-out | tee probe.log
          { echo '## 層1のデータ'; cat layer1-out/summary.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: layer1-data-probe, path: "layer1-out/", retention-days: 30 }
