# テスト：回帰テスト（PostGIS）と PHP の構文チェック
name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      pg:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
      - run: pip install -r requirements.txt pytest
      - run: for f in web/public/*.php web/app/*.php; do php -l "$f" >/dev/null || exit 1; done
      - run: pytest -q tests
        env: { TEST_PG: "postgresql://app:app@localhost:5432" }
