# 利用者のリストの場所を手入力の地点として登録する（位置は OSM の要素から決める）
# dry_run：位置と近くの地点を出すだけ / apply：create_manual_spot で登録（同じ名前が200m以内にあれば登録しない）
name: curated-import
on:
  workflow_dispatch:
    inputs:
      data:
        description: "リストのファイル（data/curated/ の下）"
        default: "data/curated/2026-10-30_road_facilities.json"
      mode:
        type: choice
        options: [dry_run, apply]
        default: dry_run
concurrency:
  group: ${{ inputs.mode == 'apply' && 'database' || 'curated-dry' }}
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - run: pip install -r requirements.txt
      - name: 登録
        run: |
          python -m tools.curated_import --data "${{ inputs.data }}" --${{ inputs.mode == 'apply' && 'apply' || 'dry-run' }} --out curated-out | tee -a "$GITHUB_STEP_SUMMARY"
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
